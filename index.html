<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ibrave OS</title>
    <meta name="description" content="One system, from first hello to final invoice. Hours logged once drive approvals, invoices, payouts and margin." />
    <meta name="theme-color" content="#241f1b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />

    <!-- icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ibrave OS" />
    <meta property="og:title" content="ibrave OS" />
    <meta property="og:description" content="One system, from first hello to final invoice. Hours logged once drive approvals, invoices, payouts and margin." />
    <meta property="og:url" content="https://os.ibrave.co/" />
    <meta property="og:image" content="https://os.ibrave.co/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ibrave OS, one system from first hello to final invoice" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ibrave OS" />
    <meta name="twitter:description" content="One system, from first hello to final invoice." />
    <meta name="twitter:image" content="https://os.ibrave.co/og-image.png" />

    <!-- internal tool: keep link previews for the team, keep crawlers out -->
    <meta name="robots" content="noindex, nofollow" />
    <style>
      /* Static splash — visible instantly while the JS bundle loads. It lives
         INSIDE #root, so React's first render replaces it automatically. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #f4f1ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      #splash .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #splash .mark {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #b0762a;
        color: #fdf9f0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash .word {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: #211d18;
      }
      #splash .track {
        width: 144px;
        height: 2px;
        border-radius: 999px;
        background: #e2ddd3;
        overflow: hidden;
      }
      #splash .bar {
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: #b0762a;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: #17140f; }
        #splash .word { color: #ece7dd; }
        #splash .track { background: #322d26; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="brand">
          <div class="mark">i</div>
          <div class="word">ibrave&nbsp;OS</div>
        </div>
        <div class="track"><div class="bar"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
