<!doctype html><html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#241f1b;
       font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
       display:flex;flex-direction:column;overflow:hidden;position:relative}
  .glow{position:absolute;top:-260px;right:-200px;width:720px;height:720px;
        border-radius:50%;background:#b0762a;opacity:.16;filter:blur(90px)}
  .rule{height:6px;background:#b0762a;flex:none}
  .body{flex:1;padding:66px 78px 0;position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:20px}
  .mark{width:78px;height:78px;border-radius:18px;background:#b0762a;color:#fdf9f0;
        font-family:Georgia,serif;font-size:50px;display:flex;align-items:center;
        justify-content:center;padding-bottom:5px}
  .word{font-family:Georgia,serif;font-size:44px;color:#f5f1e8;letter-spacing:-.01em}
  .word b{color:#c4handled;font-weight:400}
  h1{font-family:Georgia,serif;font-weight:400;font-size:62px;line-height:1.12;
     color:#f5f1e8;letter-spacing:-.02em;margin-top:62px;max-width:900px}
  p{margin-top:26px;font-size:23px;line-height:1.55;color:#a49c8f;max-width:760px}
  .foot{position:absolute;bottom:0;left:78px;right:78px;height:96px;
        border-top:1px solid #3a332c;display:flex;align-items:center;
        justify-content:space-between;color:#8a8478;font-size:17px}
  .foot .chips{display:flex;gap:10px}
  .chip{border:1px solid #3a332c;border-radius:20px;padding:5px 14px;font-size:14px;
        font-family:"SF Mono",Menlo,monospace;color:#a49c8f}
</style></head><body>
  <div class="glow"></div>
  <div class="rule"></div>
  <div class="body">
    <div class="brand">
      <div class="mark">i</div>
      <div class="word">ibrave&nbsp;<span style="color:#c98f3c">OS</span></div>
    </div>
    <h1>One system, from first<br/>hello to final invoice.</h1>
    <p>Hours logged once drive approvals, invoices, payouts and margin, every
       number traceable to the record that produced it.</p>
    <div class="foot">
      <span>os.ibrave.co</span>
      <span class="chips">
        <span class="chip">timesheets</span>
        <span class="chip">invoicing</span>
        <span class="chip">staffing</span>
        <span class="chip">talent</span>
      </span>
    </div>
  </div>
</body></html>
